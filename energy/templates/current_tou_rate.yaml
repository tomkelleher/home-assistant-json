sensor:
  - name: "Current TOU Rate"
    unit_of_measurement: "USD/kWh"
    state_class: measurement
    state: >
      {% set now = now() %}
      {% set seasons = state_attr('sensor.tou_rate_plan', 'seasons') %}
      {% if not seasons %}
        unavailable
      {% else %}
        {% set season = seasons | selectattr('name', 'eq',
          'summer' if 6 <= now.month <= 9 else 'winter') | list | first %}
        {% set current_time = now.strftime('%H:%M:%S') %}
        {% set result = namespace(period='off_peak') %}
        {% for label, periods in season.tou_period.items() %}
          {% for p in periods %}
            {% if p.start_time <= current_time <= p.end_time %}
              {% set result.period = label %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ season.rates[result.period].value }}
      {% endif %}
